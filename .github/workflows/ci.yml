name: CI

on:
  push:
    branches: [master, main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'database/**'
      - '.github/workflows/ci.yml'
      - 'codecov.yml'
  pull_request:
    branches: [master, main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - 'database/**'
      - '.github/workflows/ci.yml'
      - 'codecov.yml'

# Cancel in-progress runs when a new run is triggered
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.27'

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          install-mode: goinstall

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Run tests
        # -coverpkg so coverage includes imported packages (needed for cross-package
        # tests; matches integration jobs below for a consistent merge).
        run: go test -v -race -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload unit coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage.out

  test-mysql:
    name: Test with MySQL
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: mysql
          MYSQL_DATABASE: alertsnitch
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      ALERTSNITCH_BACKEND: mysql
      ALERTSNITCH_BACKEND_ENDPOINT: "root:mysql@tcp(127.0.0.1:3306)/alertsnitch"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install MySQL client
        run: sudo apt-get update && sudo apt-get install -y mysql-client

      - name: Bootstrap MySQL
        run: |
          mysql -h 127.0.0.1 -u root -pmysql alertsnitch < database/mysql/0.0.1-bootstrap.sql
          mysql -h 127.0.0.1 -u root -pmysql alertsnitch < database/mysql/0.1.0-fingerprint.sql
          mysql -h 127.0.0.1 -u root -pmysql alertsnitch < database/mysql/0.2.0-labelkv.sql
          mysql -h 127.0.0.1 -u root -pmysql alertsnitch < database/mysql/0.3.0-alertgroup-kv.sql

      - name: Run tests
        # Integration tests live in package storage_test and drive sqlstore via the
        # Storer interface. Without -coverpkg, go test only attributes coverage to
        # the package under test — mysql.go/postgres.go stay at 0% on Codecov.
        run: go test -v -race -tags integration -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload MySQL coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-mysql
          path: coverage.out

  test-postgres:
    name: Test with PostgreSQL
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: runner
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: alertsnitch
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ALERTSNITCH_BACKEND: postgres
      ALERTSNITCH_BACKEND_ENDPOINT: "sslmode=disable user=runner password=postgres host=127.0.0.1 database=alertsnitch"
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Bootstrap PostgreSQL
        run: |
          PGPASSWORD=postgres psql -h 127.0.0.1 -U runner -d alertsnitch -f database/postgres/0.0.1-bootstrap.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -U runner -d alertsnitch -f database/postgres/0.1.0-fingerprint.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -U runner -d alertsnitch -f database/postgres/0.2.0-labelkv.sql
          PGPASSWORD=postgres psql -h 127.0.0.1 -U runner -d alertsnitch -f database/postgres/0.3.0-alertgroup-kv.sql

      - name: Run tests
        # See test-mysql: -coverpkg is required so sqlstore hits from storage_test
        # integration tests appear in the coverprofile.
        run: go test -v -race -tags integration -coverprofile=coverage.out -covermode=atomic -coverpkg=./... ./...

      - name: Upload PostgreSQL coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage-postgres
          path: coverage.out

  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: [test, test-mysql, test-postgres]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Download coverage artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          path: coverage
          merge-multiple: false

      - name: Merge coverage reports
        run: |
          go run github.com/wadey/gocovmerge@v0.0.0-20160331181800-b5bfa59ec0ad \
            coverage/coverage-unit/coverage.out \
            coverage/coverage-mysql/coverage.out \
            coverage/coverage-postgres/coverage.out > coverage.out
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage.out
          disable_search: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, test, test-mysql, test-postgres, coverage]
    strategy:
      matrix:
        goos: [linux, darwin]
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: 0
        run: |
          go build -ldflags "-s -w -X github.com/mikehsu0618/alertsnitch/version.Version=${{ github.ref_name }} -X github.com/mikehsu0618/alertsnitch/version.Commit=${{ github.sha }}" \
            -o alertsnitch-${{ matrix.goos }}-${{ matrix.goarch }}

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: alertsnitch-${{ matrix.goos }}-${{ matrix.goarch }}
          path: alertsnitch-${{ matrix.goos }}-${{ matrix.goarch }}

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test, test-mysql, test-postgres, coverage]
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name == 'push' && github.ref == 'refs/heads/master'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set image name
        id: image
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ "${{ github.ref }}" = "refs/heads/master" ]; then
            echo "name=${{ secrets.DOCKERHUB_USERNAME }}/alertsnitch" >> "$GITHUB_OUTPUT"
          else
            echo "name=alertsnitch/ci" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
